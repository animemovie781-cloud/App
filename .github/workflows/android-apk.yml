name: Android APK Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Ubuntu GitHub runners include Android command-line tools and
      # pre-accepted SDK licenses. Do not pipe "yes" into --licenses:
      # sdkmanager exits early when licenses are already accepted.
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "Android sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APK_NAME="Zangetsu-${GITHUB_REF_NAME}.apk"
          else
            APK_NAME="Zangetsu-debug-${GITHUB_RUN_NUMBER}.apk"
          fi
          mkdir -p release-assets
          cp "$APK_PATH" "release-assets/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zangetsu-apk-${{ github.run_number }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zangetsu ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*.apk
          fail_on_unmatched_files: true
